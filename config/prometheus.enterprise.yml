global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: supportforge
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/backend.token
    static_configs:
      - targets: [supportforge:7000]
        labels:
          service: supportforge
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
