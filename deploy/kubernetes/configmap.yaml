apiVersion: v1
kind: ConfigMap
metadata:
  name: supportforge-config
  namespace: supportforge
  labels:
    app.kubernetes.io/name: supportforge
data:
  SERVER_PORT: "7000"
  SPRING_PROFILES_ACTIVE: enterprise
  SUPPORTFORGE_FEATURE_POSTGRES_PERSISTENCE: "true"
  SUPPORTFORGE_FEATURE_OBJECT_STORAGE: "true"
  SUPPORTFORGE_FEATURE_QDRANT_RETRIEVAL: "true"
  SUPPORTFORGE_FEATURE_KAFKA_INDEXING: "true"
  SUPPORTFORGE_FEATURE_GROUNDING_HARNESS: "true"
  SUPPORTFORGE_FEATURE_DISTRIBUTED_CACHE: "true"
  SUPPORTFORGE_FEATURE_MULTI_TENANCY: "true"
  SUPPORTFORGE_PERSISTENCE_INTENT_LEARNING: postgres
  SUPPORTFORGE_PERSISTENCE_KNOWLEDGE: postgres
  SUPPORTFORGE_PERSISTENCE_MEMORY: postgres
  SUPPORTFORGE_PERSISTENCE_FEEDBACK: postgres
  SUPPORTFORGE_PERSISTENCE_EVALUATION: postgres
  SUPPORTFORGE_POSTGRES_URL: jdbc:postgresql://postgresql.database.svc.cluster.local:5432/supportforge
  SUPPORTFORGE_POSTGRES_SCHEMA: supportforge
  SUPPORTFORGE_POSTGRES_MAXIMUM_POOL_SIZE: "20"
  SUPPORTFORGE_POSTGRES_MINIMUM_IDLE: "2"
  SUPPORTFORGE_POSTGRES_CONNECTION_TIMEOUT: 5s
  SUPPORTFORGE_POSTGRES_MIGRATION_ENABLED: "true"
  SUPPORTFORGE_OBJECT_STORAGE_PROVIDER: s3
  SUPPORTFORGE_OBJECT_STORAGE_ENDPOINT: https://s3.example.internal
  SUPPORTFORGE_OBJECT_STORAGE_BUCKET: supportforge-knowledge
  SUPPORTFORGE_OBJECT_STORAGE_REGION: us-east-1
  SUPPORTFORGE_OBJECT_STORAGE_AUTO_CREATE_BUCKET: "false"
  SUPPORTFORGE_QDRANT_PROVIDER: qdrant
  SUPPORTFORGE_QDRANT_ENDPOINT: http://qdrant.vector.svc.cluster.local:6333
  SUPPORTFORGE_QDRANT_COLLECTION: supportforge_knowledge_v1
  SUPPORTFORGE_QDRANT_DENSE_VECTOR_NAME: qwen3_dense
  SUPPORTFORGE_QDRANT_INDEX_VERSION: knowledge-qwen3-v1
  SUPPORTFORGE_QDRANT_DIMENSIONS: "1024"
  SUPPORTFORGE_EMBEDDING_PROVIDER: openai-compatible
  SUPPORTFORGE_EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
  SUPPORTFORGE_EMBEDDING_MODEL_VERSION: qwen3-embedding-v1
  SUPPORTFORGE_EMBEDDING_ENDPOINT: http://qwen3-embedding.ai-models.svc.cluster.local:8000/v1/embeddings
  SUPPORTFORGE_EMBEDDING_DIMENSIONS: "1024"
  SUPPORTFORGE_RERANKER_PROVIDER: vllm
  SUPPORTFORGE_RERANKER_MODEL: Qwen/Qwen3-Reranker-0.6B
  SUPPORTFORGE_RERANKER_ENDPOINT: http://qwen3-reranker.ai-models.svc.cluster.local:8001/v1/rerank
  SUPPORTFORGE_KAFKA_BOOTSTRAP_SERVERS: kafka.messaging.svc.cluster.local:9092
  SUPPORTFORGE_VALKEY_URI: redis://valkey.cache.svc.cluster.local:6379
  SUPPORTFORGE_OTLP_TRACING_ENABLED: "true"
  SUPPORTFORGE_OTLP_TRACING_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
  SUPPORTFORGE_TRACING_SAMPLE_PROBABILITY: "0.10"
  SUPPORTFORGE_RATE_LIMIT_REQUESTS: "1000"
  SUPPORTFORGE_RATE_LIMIT_WINDOW: 1m
  SUPPORTFORGE_MAXIMUM_CONCURRENT_CALLS: "200"
  SUPPORTFORGE_DEPENDENCY_TIMEOUT: 2s
  SUPPORTFORGE_SLO_AVAILABILITY_TARGET: "0.99"
  SUPPORTFORGE_SLO_LATENCY_TARGET_MS: "2000"
