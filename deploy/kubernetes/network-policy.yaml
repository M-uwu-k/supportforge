apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: supportforge-ingress
  namespace: supportforge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: supportforge
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: supportforge
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 7000
