services:

  supportforge:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    container_name: supportforge

    ports:
      - "${SUPPORTFORGE_PORT:-7000}:7000"

    environment:
      SERVER_PORT: 7000
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SUPPORTFORGE_INSTANCE_ID: ${SUPPORTFORGE_INSTANCE_ID:-docker-local}

      SUPPORTFORGE_LLM_PROVIDER: ${SUPPORTFORGE_LLM_PROVIDER:-mock}
      SUPPORTFORGE_LLM_MODEL: ${SUPPORTFORGE_LLM_MODEL:-mock-v1}
      SUPPORTFORGE_LLM_CHAT_URL: ${SUPPORTFORGE_LLM_CHAT_URL:-http://host.docker.internal:11434/v1/chat/completions}
      SUPPORTFORGE_LLM_API_KEY: ${SUPPORTFORGE_LLM_API_KEY:-}
      SUPPORTFORGE_LLM_THINKING_MODE: ${SUPPORTFORGE_LLM_THINKING_MODE:-}
      SUPPORTFORGE_LLM_CHAT_MAX_TOKENS: ${SUPPORTFORGE_LLM_CHAT_MAX_TOKENS:-4096}
      SUPPORTFORGE_LLM_SPECIALIST_MAX_TOKENS: ${SUPPORTFORGE_LLM_SPECIALIST_MAX_TOKENS:-2048}
      SUPPORTFORGE_LLM_INTENT_MAX_TOKENS: ${SUPPORTFORGE_LLM_INTENT_MAX_TOKENS:-1024}
      SUPPORTFORGE_LLM_JUDGE_MAX_TOKENS: ${SUPPORTFORGE_LLM_JUDGE_MAX_TOKENS:-2048}
      SUPPORTFORGE_MEMORY_SUMMARY_MAX_TOKENS: ${SUPPORTFORGE_MEMORY_SUMMARY_MAX_TOKENS:-1024}
      SUPPORTFORGE_LLM_CONNECT_TIMEOUT: ${SUPPORTFORGE_LLM_CONNECT_TIMEOUT:-10s}
      SUPPORTFORGE_LLM_READ_TIMEOUT: ${SUPPORTFORGE_LLM_READ_TIMEOUT:-120s}

      SUPPORTFORGE_SKILLS_ROOT: /app/skills

      SUPPORTFORGE_KNOWLEDGE_STORAGE_PATH: /app/data/knowledge-documents.json
      SUPPORTFORGE_OBJECT_STORAGE_PROVIDER: filesystem
      SUPPORTFORGE_OBJECT_STORAGE_FILESYSTEM_ROOT: /app/data/object-storage
      SUPPORTFORGE_MEMORY_STORAGE_PATH: /app/data/conversation-memory.json
      SUPPORTFORGE_FEEDBACK_STORAGE_PATH: /app/data/feedback.json
      SUPPORTFORGE_EVALUATION_REPORT_PATH: /app/data/evaluation-reports.json
      SUPPORTFORGE_INTENT_LEARNING_STORAGE_PATH: /app/data/intent-learning.json

    volumes:
      - supportforge-data:/app/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    stop_grace_period: 45s

    read_only: true

    tmpfs:
      - /tmp:size=256m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - supportforge-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:7000/actuator/health/readiness || exit 1"
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3


  prometheus:
    image: prom/prometheus:latest

    container_name: supportforge-prometheus

    ports:
      - "127.0.0.1:9090:9090"

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=200h"

    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    depends_on:
      supportforge:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - supportforge-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:9090/-/healthy || exit 1"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3


networks:
  supportforge-network:
    driver: bridge


volumes:
  supportforge-data:
  prometheus-data:
